name: Build and deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install mkdocs-material
        run: pip install "mkdocs-material>=9.5" "mkdocs>=1.6"

      - name: Generate llms-full.txt from docs
        run: python scripts/build_llms_full.py

      - name: Build site
        run: mkdocs build --strict

      - name: Copy llms.txt files to site root verbatim
        # mkdocs treats .txt as static and copies them, but we double-check
        # the URL paths so / and /llms.txt and /llms-full.txt all resolve.
        run: |
          test -f site/llms.txt
          test -f site/llms-full.txt
          ls -la site/llms*.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
