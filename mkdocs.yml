site_name: ai-audit-trail
site_description: Cryptographically verifiable audit trails for AI systems — Ed25519, hash-chained Decision Receipts with ISO 42001 / NIST AI RMF / EU AI Act mappings.
site_url: https://sundsoffice-tech.github.io/ai-audit-trail/
repo_url: https://github.com/sundsoffice-tech/ai-audit-trail
repo_name: sundsoffice-tech/ai-audit-trail
edit_uri: edit/main/docs/

theme:
  name: material
  # Template overrides: no GitHub API call on page load (partials/source.html),
  # search share link with a real target (partials/search.html), page title,
  # Open Graph tags and JSON-LD (main.html).
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Integrations: integrations.md
  - Compliance: compliance.md
  - CLI: cli.md

# Fonts (Roboto, Roboto Mono) are downloaded at build time and shipped with the
# site, so a visitor's browser never contacts fonts.googleapis.com or
# fonts.gstatic.com. The same goes for the two scripts the theme would load
# from unpkg.com at runtime (Mermaid, ResizeObserver polyfill). `links: false`
# keeps external links exactly as written. Listing `search` is required as
# soon as `plugins` is set, otherwise the default search plugin is dropped.
plugins:
  - search
  - privacy:
      links: false
      assets_expr_map:
        .js: '["''](?P<url>(?:https?:)?//(?:[^"'']+\.(?:css|js(?:on)?)|unpkg\.com/resize-observer-polyfill))["'']'

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra:
  # <title> and og:title of the start page (30 to 60 characters).
  homepage_title: "ai-audit-trail: verifiable audit trails for AI systems"
  # Publisher named in the JSON-LD block of the start page.
  publisher:
    name: S&S Connect GbR
    url: https://sundsconnect.de/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sundsoffice-tech/ai-audit-trail
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ai-audit-trail/

# Ship llms.txt and llms-full.txt verbatim at the docs root so LLM tools
# (Cursor @docs, Context7, Anthropic Skills) can ingest them directly.
not_in_nav: |
  llms.txt
  llms-full.txt
  impressum.md
  datenschutz.md

# Absolute links, because the footer is rendered on every page depth.
copyright: >-
  MIT licensed. &copy; 2026 S&amp;S Connect.
  <a href="https://sundsoffice-tech.github.io/ai-audit-trail/impressum/">Impressum</a> |
  <a href="https://sundsoffice-tech.github.io/ai-audit-trail/datenschutz/">Datenschutz</a>
